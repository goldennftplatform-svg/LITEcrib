# LITEcrib — Litecoin Core configuration template (TESTNET).
# The relay does NOT need a Core node (the HD wallet + Litecoin Space indexer
# cover deposits/status/broadcast). Run one only if you want a full node and
# an extra broadcast/status path (set LTC_RPC_URL/USER/PASS to match).

testnet=1

# --- RPC -------------------------------------------------------------
server=1
rpcuser=litecrib
rpcpassword=CHANGE_ME_TO_A_LONG_RANDOM_STRING
rpcport=19332
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
# Leave this OFF unless you genuinely need it (local relays talk to the node
# directly, never over the public internet):
# rpcallowip=0.0.0.0/0

# --- Wallet ------------------------------------------------------------
# Deterministic HD wallet so getnewaddress/listunspent/sendrawtransaction work
# if you choose node-as-backend. The relay derives its own addresses regardless.
walletname=
keypool=1000

# --- Networking ---------------------------------------------------------
# Only the relay (localhost) talks to the node on testnet:
bind=127.0.0.1
listen=1
maxconnections=40

# --- Mempool / index (needed by /address/:addr + /tx broadcasting) ------
# Litecoin Core < 0.17-ish needs a full txindex for address lookups. With
# Litecoin Space / mempool.space in front, Core's own index is optional.
txindex=1

# --- Privacy -----------------------------------------------------------
daemon=1
# If you use a Tor daemon:
# onlynet=onion
# proxy=127.0.0.1:9050